<!doctype html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta name="demo-app" content="true"/>
    <link rel="stylesheet" href="css/style.css" />
    <title>Test Ticks API</title>
  </head>
  <body>
    <div style="position:fixed; width: 150px; height: 38px; right: 0;" class="ollave-ticks"></div>
    <div style="display: flex; justify-content: space-between;">
      <textarea rows="12" cols="40" id="cli"></textarea>
      <div style="flex-grow: 1" class="tags-app-root"></div>
      <textarea class="program" rows="15" cols="20"></textarea>
      <div>
        <pre id="cli-out" style="width: 300px; margin-top: 30px; max-height: 300px; overflow-y: auto;"></pre>
      </div>
      <div id="controls-1" style="position: fixed; bottom: 0; left: 0; width: 300px; height: 300px; background-color: #f0f0f0; z-index: 1000;"></div>
    </div>
    <script type="module">
      // Auto-run the ticks tests when page loads
      import { createApp } from 'peprn/browser'
      import { testRangeUtil } from '/js/lib/util/rangeUtilTests.js'
      import { init as songInit } from '/js/lib/util/songUtil.js'
      import { updateTestMode } from '/js/lib/schemas.js'
      
      updateTestMode(true)
      document.body.style.backgroundColor = 'blue'
      document.body.style.color = 'white'
      
      createApp({
        id: 'cli',
        init: async () => {
          await songInit()
          // Auto-run ticks tests after initialization
          setTimeout(() => {
            const cliElement = document.getElementById('cli')
            if (cliElement) {
              cliElement.value = 'testRangeUtil registerTicks'
              cliElement.dispatchEvent(new KeyboardEvent('keyup', { key: 'Enter' }))
            }
          }, 1000)
          return Promise.resolve(null)
        },
        modules: {
          testRangeUtil: testRangeUtil,
        },
      })
    </script>
  </body>
</html>
